# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Latest images

on:
  # Rebuild every week on Sunday at 8:20 UTC
  schedule:
    - cron: 20 8 * * 0

  # Build when a release is published
  release:
    types:
      - published

  # Allow manually triggered rebuilds
  workflow_dispatch:

jobs:
  parse_release_tag:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve-ref.outputs.REF_NAME }}
      baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}
    steps:
      - name: Resolve build reference
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            REF_NAME=$GITHUB_REF_NAME
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REF_NAME=$GITHUB_SHA
          else
            RELEASE_JSON="$RUNNER_TEMP/baikal-release.json"
            HTTP_STATUS=$(curl --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --output "$RELEASE_JSON" --write-out '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")
            case "$HTTP_STATUS" in
              200)
                REF_NAME=$(jq -er '.tag_name | select(type == "string" and length > 0 and . != "null")' "$RELEASE_JSON")
                ;;
              404)
                echo "::notice::No published release found; building the triggering commit."
                REF_NAME=$GITHUB_SHA
                ;;
              *)
                echo "::error::Failed to look up the latest release (HTTP $HTTP_STATUS)."
                exit 1
                ;;
            esac
          fi
          echo "Building reference $REF_NAME"
          echo "REF_NAME=$REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.REF_NAME }}
          show-progress: false

      - name: Read Baikal version
        id: parse-release-tag
        run: |
          BAIKAL_VERSION=$(sed -nE 's/^ENV VERSION[ =]+([^[:space:]]+).*$/\1/p' apache.dockerfile)
          if [ -z "$BAIKAL_VERSION" ]; then
            echo "::error::Cannot read the Baikal version from apache.dockerfile."
            exit 1
          fi
          echo "Parsed Baikal version $BAIKAL_VERSION from apache.dockerfile"
          echo "BAIKAL_VERSION=$BAIKAL_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.dockerfile }}
    needs: parse_release_tag
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      ref: ${{ needs.parse_release_tag.outputs.ref }}
    strategy:
      fail-fast: true
      matrix:
        dockerfile:
          - apache
          - apache-php8.3
          - nginx
          - nginx-php8.3

  apache:
    name: Apache
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: apache.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      tags: |
        cgibin/baikal:apache
        cgibin/baikal:latest
    secrets: inherit

  apache_php83:
    name: Apache (PHP 8.3)
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: apache-php8.3.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      tags: cgibin/baikal:apache-php8.3
    secrets: inherit

  nginx:
    name: Nginx
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      tags: cgibin/baikal:nginx
    secrets: inherit

  nginx_php83:
    name: Nginx (PHP 8.3)
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx-php8.3.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      tags: cgibin/baikal:nginx-php8.3
    secrets: inherit
