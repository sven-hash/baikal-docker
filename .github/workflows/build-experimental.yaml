# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Experimental images

on:
  # Rebuild every quarter on Sunday at 8:20 UTC
  schedule:
    - cron: 20 8 * 1/3 0

  # Build on push to master
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-experimental.yaml
      - "*.dockerfile"
      - files/**

concurrency:
  group: build-experimental-images
  cancel-in-progress: true

# Run the automated tests first, then publish the images if the tests pass
jobs:
  test:
    name: ${{ matrix.dockerfile }}
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
    strategy:
      fail-fast: true
      matrix:
        dockerfile:
          - nginx
          - nginx-php8.3
          - nginx-php8.4

  nginx:
    name: Nginx
    needs: test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      # Sury PHP packages are unavailable for i386.
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: experimental
      tags: |
        cgibin/baikal:experimental-nginx
        cgibin/baikal:experimental
    secrets: inherit

  nginx_php83:
    name: Nginx (PHP 8.3)
    needs: test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx-php8.3.dockerfile
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: experimental
      tags: |
        cgibin/baikal:experimental-nginx-php8.3
        cgibin/baikal:experimental-php8.3
    secrets: inherit

  nginx_php84:
    name: Nginx (PHP 8.4)
    needs: test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx-php8.4.dockerfile
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: experimental
      tags: |
        cgibin/baikal:experimental-nginx-php8.4
        cgibin/baikal:experimental-php8.4
    secrets: inherit
