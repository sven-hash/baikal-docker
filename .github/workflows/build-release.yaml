# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Build release images

on:
  release:
    types:
      - published

concurrency:
  group: build-release-images
  cancel-in-progress: true

jobs:
  parse_release_tag:
    runs-on: ubuntu-latest
    outputs:
      baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}
    steps:
      # Get the release version by stripping build metadata from the release name
      - name: Parse release tag
        id: parse-release-tag
        run: echo BAIKAL_VERSION=${GITHUB_REF_NAME/+*/} >> "$GITHUB_OUTPUT"

  nginx:
    name: Nginx
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      # Sury PHP packages are unavailable for i386.
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      tags: |
        cgibin/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-nginx
        cgibin/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}
    secrets: inherit

  nginx_php83:
    name: Nginx (PHP 8.3)
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx-php8.3.dockerfile
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      tags: |
        cgibin/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-nginx-php8.3
        cgibin/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-php8.3
    secrets: inherit
